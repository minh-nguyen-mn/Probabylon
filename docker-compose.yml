services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: probabylon
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d probabylon"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/probabylon
      DATABASE_URL_UNPOOLED: postgresql+psycopg://postgres:postgres@db:5432/probabylon
      REDIS_URL: redis://redis:6379/0
      BROKER_URL: redis://redis:6379/1
      RESULT_BACKEND: redis://redis:6379/2
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./services/api:/app
      - ./services/worker:/app/worker
    working_dir: /app
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/probabylon
      DATABASE_URL_UNPOOLED: postgresql+psycopg://postgres:postgres@db:5432/probabylon
      REDIS_URL: redis://redis:6379/0
      BROKER_URL: redis://redis:6379/1
      RESULT_BACKEND: redis://redis:6379/2
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A worker.celery_app worker --loglevel=info
    volumes:
      - ./services/api:/app
      - ./services/worker:/app/worker
    working_dir: /app

  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/markets
    volumes:
      - ./apps/web:/app
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pg_data:
